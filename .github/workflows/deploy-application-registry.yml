name: Deploy Application Registry

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      api_image_digest:
        description: Current immutable registry API image digest.
        required: true
        type: string
      web_image_digest:
        description: Current immutable registry web image digest.
        required: true
        type: string
  workflow_call:
    inputs:
      api_image_digest:
        description: Immutable registry API image digest.
        required: true
        type: string
      web_image_digest:
        description: Immutable registry management web image digest.
        required: true
        type: string
      listing_check_runner_image_digest:
        description: Immutable listing-check runner image digest.
        required: true
        type: string
      pdf_worker_image_digest:
        description: Immutable PDF worker image digest.
        required: true
        type: string
      cache_invalidator_image_digest:
        description: Immutable cache invalidator image digest.
        required: true
        type: string

concurrency:
  group: application-registry-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy-registry-api-server:
    name: Register registry API
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/cv-application-registry-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Nomad Pack
        uses: ./.github/actions/setup-infrastructure-tools

      - name: Fetch Nomad deployment credentials
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: ${{ vars.INFISICAL_ENV }}
          domain: ${{ vars.INFISICAL_HOST || 'https://app.infisical.com' }}
          oidc-audience: https://github.com/run4w4y
          secret-path: /
          recursive: false
          include-imports: false

      - name: Register registry API service
        env:
          API_CORS_ALLOWED_ORIGINS: ${{ vars.CV_REGISTRY_WEB_ORIGIN || 'https://cv-registry.4w4y.run' }}
          API_ENABLED: "true"
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          API_SUBDOMAIN: ${{ vars.CV_API_SUBDOMAIN || 'cv-api' }}
        run: |
          set -euo pipefail
          umask 077
          : "${CF_ACCESS_CLIENT_ID:?}" "${CF_ACCESS_CLIENT_SECRET:?}" "${NOMAD_TOKEN:?}"
          nomad_tmp=$(mktemp -d "${RUNNER_TEMP}/nomad-submit.XXXXXX")
          trap 'rm -rf "$nomad_tmp"' EXIT
          pack=application-registry-api
          job_id=cv-registry
          http=(--silent --show-error --connect-timeout 10 --max-time 60
            --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
            --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            --header "X-Nomad-Token: ${NOMAD_TOKEN}"
            --header 'Content-Type: application/json')
          status=$(curl "${http[@]}" --output "$nomad_tmp/current.json" --write-out '%{http_code}' \
            "https://nomad.4w4y.run/v1/job/${job_id}?namespace=default")
          case "$status" in
            200) ;;
            404) printf 'Required job cv-registry is absent.\n' >&2; exit 1 ;;
            *) printf 'Nomad job lookup failed (HTTP %s).\n' "$status" >&2; exit 1 ;;
          esac
          jq -e --arg id "$job_id" '.ID == $id and .Namespace == "default" and .Type == "service" and
            (.JobModifyIndex | type == "number" and . > 0 and floor == .) and
            (.TaskGroups | type == "array" and length > 0)' \
            "$nomad_tmp/current.json" > /dev/null
          jq -e '.Stop != true and any(.TaskGroups[]; .Count > 0)' \
            "$nomad_tmp/current.json" > /dev/null
          jq -e --arg id "$job_id" --arg pack "$pack" '
            (.Meta // {}) as $meta |
            $meta["pack.deployment_name"] == $pack and
            ({"pack.deployment_name": $pack, "pack.name": $pack,
              "pack.job": $id, "pack.registry": "<<local folder>>"} | to_entries |
              all(. as $entry | ($meta | has($entry.key) | not) or $meta[$entry.key] == $entry.value))
          ' "$nomad_tmp/current.json" > /dev/null
          nomad-pack render nomad/packs/application-registry-api \
            --to-dir "$nomad_tmp/render" --skip-aux-files \
            --parser-v1 \
            --var "docker_image=${REGISTRY}/${IMAGE_NAME}@${API_IMAGE_DIGEST}" \
            --var "enabled=${API_ENABLED}" \
            --var "cors_allowed_origins=${API_CORS_ALLOWED_ORIGINS}" \
            --var "traefik_subdomain=${API_SUBDOMAIN}" > /dev/null
          shopt -s nullglob globstar
          all_jobs=("$nomad_tmp/render"/**/*.nomad)
          files=("$nomad_tmp/render/$pack"/**/*.nomad)
          [[ ${#all_jobs[@]} -eq 1 && ${#files[@]} -eq 1 ]]
          jq -n --rawfile hcl "${files[0]}" '{JobHCL: $hcl, Canonicalize: true}' > "$nomad_tmp/parse.json"
          status=$(curl "${http[@]}" --fail --output "$nomad_tmp/job.json" --write-out '%{http_code}' \
            --data-binary "@$nomad_tmp/parse.json" https://nomad.4w4y.run/v1/jobs/parse)
          [[ "$status" == 200 ]]
          jq -e --arg id "$job_id" '.ID == $id and .Name == $id and .Namespace == "default" and .Type == "service"' \
            "$nomad_tmp/job.json" > /dev/null
          jq --slurpfile current "$nomad_tmp/current.json" --rawfile hcl "${files[0]}" '
            .Meta = ((.Meta // {}) + ($current[0].Meta // {})) |
            {Job: ., EnforceIndex: true, JobModifyIndex: $current[0].JobModifyIndex,
              Submission: {Source: $hcl, Format: "hcl2"}}
          ' "$nomad_tmp/job.json" > "$nomad_tmp/register.json"
          status=$(curl "${http[@]}" --fail --output "$nomad_tmp/registered.json" --write-out '%{http_code}' \
            --data-binary "@$nomad_tmp/register.json" https://nomad.4w4y.run/v1/jobs)
          [[ "$status" == 200 ]]
          jq -e 'select((.EvalID | type) == "string" and (.EvalID | length) > 0 and
            (.JobModifyIndex | type == "number" and . > 0)) | {EvalID, JobModifyIndex}' "$nomad_tmp/registered.json"

      - name: Wait for registry migration and API rollout
        run: |
          set -euo pipefail
          : "${CF_ACCESS_CLIENT_ID:?}" "${CF_ACCESS_CLIENT_SECRET:?}" "${NOMAD_TOKEN:?}"
          nomad_api() {
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              --header "X-Nomad-Token: ${NOMAD_TOKEN}" \
              "https://nomad.4w4y.run$1"
          }

          deployment="$(
            nomad_api "/v1/job/cv-registry/deployment"
          )"
          deployment_id="$(jq -er '.ID' <<<"$deployment")"
          previous_status=""

          for _ in {1..120}; do
            deployment="$(
              nomad_api "/v1/deployment/${deployment_id}"
            )"
            status="$(jq -er '.Status' <<<"$deployment")"
            description="$(
              jq -er '.StatusDescription // "No description"' <<<"$deployment"
            )"

            if [[ "$status" != "$previous_status" ]]; then
              printf 'Registry deployment %s: %s (%s)\n' \
                "$deployment_id" "$status" "$description"
              previous_status="$status"
            fi

            case "$status" in
              successful)
                exit 0
                ;;
              running | pending | initializing | unblocking)
                sleep 2
                ;;
              *)
                printf 'Registry deployment failed: %s (%s)\n' \
                  "$status" "$description" >&2
                exit 1
                ;;
            esac
          done

          printf 'Registry deployment %s did not finish within four minutes.\n' \
            "$deployment_id" >&2
          exit 1

  deploy-registry-web:
    name: Register registry management web
    needs: deploy-registry-api-server
